services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    # pinned: Compose prefixes volumes with the folder name; the project folder was
    # renamed ecommerce_api -> ecommerce, so pin the original name to keep existing data
    name: ecommerce_api_pgdata
